<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>About Us - Hotdog Heaven</title>

		<!-- Page styling -->
		<style>
			body {
				margin: 0;
				background-color: #00ffff; /* Aqua blue background */
				font-family: Arial, sans-serif;

				height: 100vh;
				color: #333;
				text-align: center;
			}

			.container {
				display: flex;
				justify-content: center;
				align-items: center;
				flex-direction: column;
				padding: 20px;
				max-width: 100%;
			}

			h1 {
				font-size: 48px;
				margin-bottom: 20px;
			}

			p {
				font-size: 18px;
				line-height: 1.6;
			}
			header {
				background-color: #009dff; /* Tomato Red */
				color: white;
				padding: 1rem 0;
				text-align: center;
				box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
			}
			nav ul {
				list-style: none;
				padding: 0;
				margin: 0;
				display: flex;
				justify-content: center;
			}
			nav ul li {
				margin: 0 15px;
			}
			nav ul li a {
				color: white;
				text-decoration: none;
				font-weight: bold;
				transition: color 0.3s ease;
			}
			nav ul li a:hover {
				color: #ffd700; /* Gold */
			}
		</style>
	</head>
	<body>
		<header>
			<h1>Hotdog Heaven Catering</h1>
			<nav>
				<ul>
					<li><a href="/">Home</a></li>
					<li><a href="/about">About Us</a></li>
					<li><a href="/products">Products</a></li>
					<li><a href="/contacts">Contact Us</a></li>
				</ul>
			</nav>
		</header>
		<!-- Main content container -->
		<div class="container">
			<!-- Page heading -->
			<h1>About Us</h1>

			<!-- Description text -->
			<p>
				Welcome to Hotdog Heaven!<br /><br />
				We’re a small team of hotdog lovers serving delicious, affordable, and
				freshly made hotdogs. Our mission is simple: bring joy to your taste
				buds with every bite.<br />
			</p>
		</div>
	</body>
</html>
