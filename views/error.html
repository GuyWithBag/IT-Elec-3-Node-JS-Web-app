<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Page Not Found - Hotdog Heaven Catering</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				margin: 0;
				padding: 0;
				background-color: #00ffff; /* Cyan background */
				color: #333;
				line-height: 1.6;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				min-height: 100vh;
				text-align: center;
			}
			.error-container {
				max-width: 600px;
				padding: 40px;
				background-color: white;
				border-radius: 8px;
				box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
			}
			h1 {
				font-size: 4em;
				color: #ff6347; /* Tomato Red */
				margin-bottom: 10px;
			}
			p {
				font-size: 1.2em;
				margin-bottom: 20px;
			}
			.btn {
				display: inline-block;
				background-color: #ff6347;
				color: white;
				padding: 10px 20px;
				text-decoration: none;
				border-radius: 5px;
				transition: background-color 0.3s ease;
			}
			.btn:hover {
				background-color: #cd5c5c; /* Indian Red */
			}
		</style>
	</head>
	<body>
		<div class="error-container">
			<h1>404</h1>
			<p>Oops! It looks like the hotdogs got lost on this page.</p>
			<p>The page you're looking for doesn't exist.</p>
			<a href="index.html" class="btn">Go Back to Hotdog Heaven Home</a>
		</div>
	</body>
</html>
