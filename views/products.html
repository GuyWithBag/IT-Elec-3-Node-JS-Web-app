<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Our Hotdogs</title>
		<style>
			body {
				margin: 0;
				background-color: aquamarine;
				font-family: Arial, sans-serif;
				color: #333;
				text-align: center;
			}
			header {
				background-color: #009dff; /* Tomato Red */
				color: white;
				padding: 1rem 0;
				text-align: center;
				box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
			}
			nav ul {
				list-style: none;
				padding: 0;
				margin: 0;
				display: flex;
				justify-content: center;
			}
			nav ul li {
				margin: 0 15px;
			}
			nav ul li a {
				color: white;
				text-decoration: none;
				font-weight: bold;
				transition: color 0.3s ease;
			}
			nav ul li a:hover {
				color: #ffd700; /* Gold */
			}
			.container {
				padding: 40px 20px;
			}

			h1 {
				font-size: 40px;
				margin-bottom: 40px;
			}

			.product {
				margin-bottom: 40px;
				max-width: 400px;
				margin-left: auto;
				margin-right: auto;
			}

			.product img {
				width: 100%;
				height: auto;
				border-radius: 8px;
				margin-bottom: 15px;
			}

			h2 {
				font-size: 24px;
				margin: 10px 0;
			}

			p {
				font-size: 16px;
				margin: 0;
			}
		</style>
	</head>
	<body>
		<header>
			<h1>Hotdog Heaven Catering</h1>
			<nav>
				<ul>
					<li><a href="/">Home</a></li>
					<li><a href="/about">About Us</a></li>
					<li><a href="/products">Products</a></li>
					<li><a href="/contacts">Contact Us</a></li>
				</ul>
			</nav>
		</header>
		<div class="container">
			<h1>Our Hotdogs</h1>

			<div class="product">
				<img src="hatdog.png" alt="Classic Hotdog" />
				<h2>Classic Hotdog</h2>
				<p>Ha? hatdog</p>
			</div>

			<div class="product">
				<img src="ches.png" alt="Cheesy Hotdog" />
				<h2>Cheesy Hotdog</h2>
				<p>chis!</p>
			</div>

			<div class="product">
				<img src="spicy.png" alt="Spicy Hotdog" />
				<h2>Spicy Hotdog</h2>
				<p>halang</p>
			</div>
		</div>
	</body>
</html>
